org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true

android.useAndroidX=true

# The Kotlin engine project tiqian includes is boring's publication project. Its
# source sets default to boring's own emission; tiqian names its emission with
# the same properties the driver passes on a pack run (-PkotlinGenDir=...).
# Values resolve against this project's root directory.
kotlinGenDir=engine-haxe/out/kotlin-f32/gen
kotlinGenTestsDir=engine-haxe/out/kotlin-f32/gen-tests
