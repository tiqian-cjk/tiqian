name: Cache the generated precompute inputs
description: Reuse native source trees generated by the pinned flake on the default branch
outputs:
  hit:
    description: Whether both generated trees came from the exact cache key
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Cache the native engine and protocol source trees
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          platforms/web/server/precompute/engine-gen
          platforms/web/server/precompute/protocol-gen
        key: precompute-generated-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'boring.json', 'engine-haxe/**', 'tools/setup-haxe-env.sh', 'tools/generate-engine-gen.mjs') }}
