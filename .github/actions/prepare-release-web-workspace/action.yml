name: Prepare a Web release workspace
description: Restore the generated inputs from the pack job or generate them for a manual release
inputs:
  artifact:
    description: Name of the shared Web artifact in this release run
    default: ""
  version:
    description: Release version for standalone runs
    required: true
  linker:
    description: Bun linker override for adapter fixtures
    default: ""
runs:
  using: composite
  steps:
    - name: Download the shared Web inputs
      if: inputs.artifact != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ github.workspace }}

    - name: Set up Nix for standalone runs
      if: inputs.artifact == ''
      uses: ./.github/actions/setup-release-nix

    - name: Generate Web inputs for standalone runs
      if: inputs.artifact == ''
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python3 tools/align-package-versions.py "${RELEASE_VERSION}"
        export BORING_PACKAGE_TSC="$RUNNER_TEMP/boring-package-tsc"
        printf '#!/usr/bin/env bash\nexec bun x --bun typescript@5.9.3/bin/tsc "$@"\n' > "$BORING_PACKAGE_TSC"
        chmod +x "$BORING_PACKAGE_TSC"

        # Generate the FFI sources before pack writes the workspace manifests.
        nix develop -c bash -e -c '
          bash tools/setup-haxe-env.sh
          node tools/generate-engine-gen.mjs ts
          boring pack protocol-ts shared-ts --project boring.json
        '

    - name: Install workspace dependencies on the Node runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RELEASE_BUN_LINKER: ${{ inputs.linker }}
      run: |
        set -euo pipefail
        # Reuse generated workspace manifests and retain Bun's default linker unless requested.
        npm install --global bun@1.3.13
        linker_args=()
        if [[ -n "$RELEASE_BUN_LINKER" ]]; then linker_args=(--linker "$RELEASE_BUN_LINKER"); fi
        bun install --ignore-scripts "${linker_args[@]}"

    - name: Assemble the Web runtime for standalone runs
      if: inputs.artifact == ''
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npm run build:runtime --workspace @tiqian/ffi
