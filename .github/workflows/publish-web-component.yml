name: Publish web-component package

# Called by .github/workflows/release.yml from the v*.*.* release tag, after
# the core lane published @tiqian/core, and gated before publishing.
on:
  workflow_call:
    inputs:
      web-inputs:
        description: Shared Web build artifact from this release run
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-tiqian-web-component
  cancel-in-progress: false

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  publish-alpha:
    name: Verify and publish alpha
    needs: [release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    defaults:
      run:
        working-directory: platforms/web/client/web-component
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.12.1

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v*.*.* ]]; then
            echo "::error::This lane runs only from a v*.*.* release tag, received ${GITHUB_REF_NAME}."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag target ${tag_commit} does not match workflow commit ${GITHUB_SHA}"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit on origin/main"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare the Web release workspace
        uses: ./.github/actions/prepare-release-web-workspace
        with:
          artifact: ${{ inputs.web-inputs }}
          version: ${{ steps.release.outputs.version }}

      - name: Build and verify the release tarball
        env:
          TIQIAN_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/tiqian-web-component-release
        run: npm run verify:release --workspace @tiqian/web-component

      - name: Inspect the release package the way a consumer receives it
        # The build step above proves the tarball matches its own checks. This
        # step installs the archive into an empty project and imports the entry
        # a consumer uses, so a manifest or file-list defect fails here instead
        # of at a registry. The job sets a package working directory, so this
        # step names the workspace paths explicitly.
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          TIQIAN_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/tiqian-web-component-release
        run: |
          set -euo pipefail
          tarball="$(find "${TIQIAN_RELEASE_ARTIFACT_DIR}" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          # @tiqian/core installs @tiqian/protocol and @tiqian/shared, which the
          # release publishes from the pack matrix after this lane; the archives
          # from the Web pack or standalone generation stand in for them.
          siblings=()
          for bundle in protocol-ts shared-ts; do
            path="$(find "${GITHUB_WORKSPACE}/engine-haxe/out/${bundle}" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
            if [[ -z "${path}" ]]; then
              echo "::error::the ${bundle} bundle wrote no archive"
              exit 1
            fi
            siblings+=(--with "${path}")
          done
          bash "${GITHUB_WORKSPACE}/tools/check-npm-package.sh" "${tarball}" \
            --expect @tiqian/web-component --entry @tiqian/web-component "${siblings[@]}"

      - name: Fix the release tarball for this run
        # The first attempt of the release run keeps the verified tarball as an
        # artifact and a re-run publishes that kept file instead of its rebuild,
        # so npm and the registry receive the same bytes.
        uses: ./.github/actions/keep-npm-tarballs
        with:
          name: npm-tarball-web-component
          root: ${{ runner.temp }}/tiqian-web-component-release
          path: ${{ runner.temp }}/tiqian-web-component-release/*.tgz

      - name: Publish the verified tarball to alpha
        shell: bash
        env:
          NPM_PUBLISH_DIVERGED_LOG: ${{ runner.temp }}/npm-diverged.txt
        run: |
          set -euo pipefail
          tarball="$(find "${RUNNER_TEMP}/tiqian-web-component-release" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "${tarball}" ]]; then
            echo "::error::Verified release tarball is missing"
            exit 1
          fi
          bash "${GITHUB_WORKSPACE}/tools/npm-publish.sh" "${tarball}" --tag alpha

      - name: Report a version npm already holds with other bytes
        # npm-publish.sh keeps a published copy that differs from this run's
        # tarball, which happens when an earlier run of the same version
        # published it. The registry lane refuses to describe such a tarball.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-diverged-web-component
          path: ${{ runner.temp }}/npm-diverged.txt
          if-no-files-found: ignore
          overwrite: true

  sync-latest:
    name: Synchronize latest dist-tag
    needs: publish-alpha
    # A trusted publisher whose connection lacks the dist-tag switch
    # answers 403; the version is already published, so this job reports it
    # without blocking the remaining lanes.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing authenticates the dist-tag write; no token is read.
      id-token: write
    steps:
      - name: Check out the release commit
        # The dist-tag step runs tools/npm-dist-tag.sh from the repository, so
        # this job needs the checkout the publish job has.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the release npm CLI
        run: npm install --global npm@11.12.1

      - name: Point latest at the published alpha
        env:
          RELEASE_VERSION: ${{ needs.publish-alpha.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0
          bash "${GITHUB_WORKSPACE}/tools/npm-dist-tag.sh" --package @tiqian/web-component --version "${RELEASE_VERSION}" --tag latest

      - name: Verify alpha and latest
        env:
          RELEASE_VERSION: ${{ needs.publish-alpha.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            tags="$(npm view @tiqian/web-component dist-tags --json)"
            if DIST_TAGS="${tags}" node --input-type=module -e '
              const tags = JSON.parse(process.env.DIST_TAGS);
              const version = process.env.RELEASE_VERSION;
              if (tags.alpha !== version || tags.latest !== version) process.exit(1);
            '; then
              echo "alpha and latest both point to ${RELEASE_VERSION}"
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then sleep 5; fi
          done
          echo "::error::npm dist-tags did not converge on ${RELEASE_VERSION}"
          exit 1
