name: Native precompute CI

# One job per concern (ADR 0050 Slice A): a failing target never masks the others,
# and workflow_dispatch lets a single lane be re-run in isolation.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-link-linux:
    name: Kotlin/Native link linux x64 arm64 mingw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android platform pieces
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-link-linux-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-link-linux-
            konan-${{ runner.os }}-
      - name: Link static libraries
        run: >
          ./gradlew
          :ffi:native:linkReleaseStaticLinuxX64
          :ffi:native:linkReleaseStaticLinuxArm64
          :ffi:native:linkReleaseStaticMingwX64

  native-tests-linux:
    name: Kotlin/Native linuxX64 module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android platform pieces
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-tests-linux-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-tests-linux-
            konan-${{ runner.os }}-
      - name: Run linuxX64 module tests
        run: >
          ./gradlew
          :engine:linuxX64Test
          :ffi:native:linuxX64Test

  native-link-macos:
    name: Kotlin/Native link macosArm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android platform pieces
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-link-macos-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-link-macos-
            konan-${{ runner.os }}-
      - name: Link static libraries
        run: ./gradlew :ffi:native:linkReleaseStaticMacosArm64

  js-node:
    name: Kotlin/JS engine export node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android platform pieces
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Run jsNodeTest
        run: ./gradlew :ffi:js:jsNodeTest

  rust:
    name: Rust workspaces build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build and test both workspaces
        run: |
          cargo build --manifest-path ffi/rust/Cargo.toml
          cargo test --manifest-path ffi/rust/Cargo.toml
          cargo build --manifest-path platforms/web/server/precompute/Cargo.toml
          cargo test --manifest-path platforms/web/server/precompute/Cargo.toml

  # ADR 0053 F4 (DualLoweringStance): the shared golden corpus binds both
  # prepared-dom implementations to the same bytes. The rust lane runs inside
  # the rust job above; this job regenerates the fixture from the js oracle and
  # fails on drift, then replays the same fixture through the js test.
  # Workspace install (root npm ci) hoists @tiqian/* packages as symlinks;
  # prose and precompute resolve them without link scripts.
  prepared-dom-corpus:
    name: Shared prepared-dom corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      # Workspace install hoists @tiqian/* packages as symlinks; prose and
      # precompute resolve them without link scripts. The build runs with
      # --noCheck: the @tiqian/ffi type declarations are gradle products
      # (ffi/js/npm/runtime) that a fresh checkout does not have, and this
      # lane verifies corpus bytes, not types. Full type checking requires
      # the ffi runtime build and stays with the local package suites (npm
      # test in both packages) and the release lanes.
      - name: Install workspace dependencies
        working-directory: .
        # npm install, not npm ci: the platform binary optional deps of the
        # precompute member are not on the registry, so no lockfile can carry
        # resolved entries for them and npm ci (npm >= 11) rejects the gap.
        run: npm install --no-audit --no-fund
      - name: Build the TypeScript packages
        working-directory: platforms/web/client/web-component
        run: npx tsc -b --noCheck
      - name: Regenerate the fixture and fail on drift
        run: |
          node platforms/web/server/core/scripts/build-prepared-dom-corpus.ts
          git diff --exit-code platforms/web/client/web-component/tests/prepared-dom-corpus.fixture.json
      - name: Replay the fixture through the js corpus test
        run: node --test platforms/web/client/web-component/tests/prepared-dom-corpus.test.js

  # The engine archive linked into the Rust tests: the cargo run below
  # exercises the C ABI through the real Kotlin/Native archive, and the npm
  # steps after it run the loader over the same engine-linked addon. The js
  # bundle feeds the npm suite.
  rust-engine-linked:
    name: Rust engine-linked tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android platform pieces
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-engine-linked-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-engine-linked-
            konan-${{ runner.os }}-
      - name: Build engine archive and js bundle
        run: >
          ./gradlew
          :ffi:native:linkReleaseStaticLinuxX64
          :ffi:js:compileProductionExecutableKotlinJs
          :ffi:js:assembleNpmPackage
      - name: Run the engine-linked cargo tests
        run: >
          TIQIAN_NATIVE_LIB_DIR=$GITHUB_WORKSPACE/ffi/native/build/bin/linuxX64/releaseStatic
          cargo test --manifest-path platforms/web/server/precompute/Cargo.toml
      # The npm loader over an engine-linked addon; the font-dependent lanes
      # self-skip on runners without fonts, so this exercises the wiring and
      # the pure entries, while the cargo run above exercises the engine.
      # Workspace install (root npm ci) hoists @tiqian/* packages as symlinks;
      # the redirect order (core full checks -> prose --noCheck -> precompute)
      # preserves the ffi declarations prerequisite from commit 81d2330c.
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install workspace dependencies
        working-directory: .
        # npm install, not npm ci: the platform binary optional deps of the
        # precompute member are not on the registry, so no lockfile can carry
        # resolved entries for them and npm ci (npm >= 11) rejects the gap.
        run: npm install --no-audit --no-fund
      - name: Build core with full type checks
        working-directory: platforms/web/client/core
        run: npx tsc -b
      - name: Emit the prose package
        working-directory: platforms/web/client/web-component
        run: npx tsc -b --noCheck
      - name: Run the npm suite engine-linked
        working-directory: platforms/web/server/core
        env:
          TIQIAN_NATIVE_LIB_DIR: ${{ github.workspace }}/ffi/native/build/bin/linuxX64/releaseStatic
        run: |
          npm run debug:native
          npm test
          npm run typecheck
