name: Build Neon precompute

# Compile-artifact lane for the Neon addon (ADR 0050), kept separate from any
# release lane: it builds every supported platform, smokes the addon through
# the npm loader, packs the npm packages, and uploads them as artifacts.
# Nothing here publishes.
on:
  workflow_call:
    inputs:
      ref:
        description: "The branch, tag, or SHA to check out"
        required: true
        type: string
  pull_request:
    paths:
      - 'frontend/web-precompute/rust/**'
      - 'frontend/web-precompute/npm/**'
      - '.github/workflows/build-neon-precompute.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/web-precompute/rust/**'
      - 'frontend/web-precompute/npm/**'
      - '.github/workflows/build-neon-precompute.yml'
  workflow_dispatch:

concurrency:
  group: build-neon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install npm dependencies
        working-directory: frontend/web-precompute/npm
        # npm install, not npm ci: the platform binary packages are not on the
        # registry yet, so no lockfile can carry entries for them.
        run: npm install --no-audit --no-fund
      - name: Look up matrix data
        id: matrixData
        working-directory: frontend/web-precompute/npm
        shell: bash
        run: |
          JSON_OUTPUT=$(npx neon show ci github | jq -rc .)
          if [[ -z "$JSON_OUTPUT" || "$JSON_OUTPUT" == "null" ]]; then
            echo "::error::Failed to get matrix data from 'npx neon show ci github'."
            exit 1
          fi
          {
            echo "json<<EOF"
            echo "$JSON_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Compute matrix
        id: matrix
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const rawJson = `${{ steps.matrixData.outputs.json }}`;
            if (!rawJson || rawJson === 'null') {
              core.setFailed("Matrix data JSON is empty or null.");
              return;
            }
            let platforms;
            try {
              platforms = JSON.parse(rawJson.trim());
            } catch (e) {
              core.setFailed(`Failed to parse matrix data JSON: ${e.message}`);
              return;
            }
            const matrix = [];
            if (platforms?.macOS) {
              matrix.push(...platforms.macOS.map(platform => ({
                os: "macos-latest", platform
              })));
            }
            if (platforms?.Windows) {
              matrix.push(...platforms.Windows.map(platform => ({
                os: "windows-latest", platform
              })));
            }
            if (platforms?.Linux) {
              matrix.push(...platforms.Linux.map(platform => ({
                os: platform.includes('arm64') ? "ubuntu-24.04-arm" : "ubuntu-latest",
                platform
              })));
            }
            console.log("Computed matrix:", matrix);
            if (matrix.length === 0) {
              core.setFailed("Computed build matrix is empty.");
            }
            return matrix;

  binaries:
    name: Build addon (${{ matrix.cfg.platform }})
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.cfg.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install npm dependencies
        working-directory: frontend/web-precompute/npm
        run: npm install --no-audit --no-fund
      - name: Build addon and place platform binary
        working-directory: frontend/web-precompute/npm
        shell: bash
        env:
          NEON_BUILD_PLATFORM: ${{ matrix.cfg.platform }}
        run: |
          cargo build --manifest-path ../rust/tiqian-precompute-neon/Cargo.toml \
            --release --message-format=json-render-diagnostics > cargo.log
          npx neon dist --name tiqian-precompute-neon < cargo.log
          test -f "platforms/${NEON_BUILD_PLATFORM}/index.node"
      - name: Smoke test through the npm loader
        working-directory: frontend/web-precompute/npm
        shell: bash
        run: npm test
      - name: Pack platform package
        working-directory: frontend/web-precompute/npm/platforms/${{ matrix.cfg.platform }}
        shell: bash
        run: |
          mkdir -p ../../pack-output
          PACK_OUTPUT=$(npm pack --pack-destination ../../pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the platform package."
            exit 1
          fi
          FILENAME=$(basename "$PACK_OUTPUT")
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
        id: pack
      - name: Upload platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-package-${{ matrix.cfg.platform }}
          path: frontend/web-precompute/npm/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  main-package:
    name: Pack main package
    needs: [matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install npm dependencies
        working-directory: frontend/web-precompute/npm
        run: npm install --no-audit --no-fund
      - name: Lint, typecheck, and build the JS entry
        working-directory: frontend/web-precompute/npm
        run: |
          npm run lint
          npm run build
          npm run typecheck
      # The packed package vendors the browser-shared modules; a stale copy
      # would fork the render contract between server and browser.
      - name: Check vendored shared modules
        working-directory: frontend/web-precompute/npm
        run: npm run check:shared
      - name: Pack
        working-directory: frontend/web-precompute/npm
        shell: bash
        id: pack
        run: |
          mkdir -p pack-output
          PACK_OUTPUT=$(npm pack --pack-destination pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the main package."
            exit 1
          fi
          echo "filename=$(basename "$PACK_OUTPUT")" >> "$GITHUB_OUTPUT"
      - name: Upload main package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-package
          path: frontend/web-precompute/npm/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect packages
    needs: [binaries, main-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: collected-packages
      - name: Verify a complete package set
        run: |
          expected="binary-package-darwin-arm64 binary-package-linux-arm64-gnu binary-package-linux-x64-gnu binary-package-win32-x64-msvc main-package"
          for name in $expected; do
            if ! find collected-packages/"$name" -name '*.tgz' | grep -q .; then
              echo "::error::Artifact $name contains no package."
              exit 1
            fi
          done
      - name: Upload package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-precompute-packages
          path: collected-packages/**/*.tgz
          if-no-files-found: error
          retention-days: 7
