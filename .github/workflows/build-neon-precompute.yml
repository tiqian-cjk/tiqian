name: Build Neon precompute

# Compile-artifact lane for the Neon addon (ADR 0050), kept separate from any
# release lane: it builds every supported platform, smokes the addon through
# the npm loader, packs the npm packages, and uploads them as artifacts.
# Nothing here publishes.
on:
  workflow_call:
    inputs:
      ref:
        description: "The branch, tag, or SHA to check out"
        required: true
        type: string
  pull_request:
    paths:
      - 'platforms/web/server/precompute/**'
      - 'platforms/web/server/core/**'
      - 'platforms/web/server/precompute/engine-gen/**'
      - '.github/workflows/build-neon-precompute.yml'
  push:
    branches: [main]
    paths:
      - 'platforms/web/server/precompute/**'
      - 'platforms/web/server/core/**'
      - 'platforms/web/server/precompute/engine-gen/**'
      - '.github/workflows/build-neon-precompute.yml'
  workflow_dispatch:

concurrency:
  group: build-neon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Generate build matrix
    needs: [engine-gen]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      # The install resolves workspace:* members tiqian-protocol and
      # tiqian-shared, whose generated trees and boring pack manifests come from
      # the engine-gen job; npm refuses the workspace protocol with
      # EUNSUPPORTEDPROTOCOL, so install with bun. The root install covers the
      # server/core member this job queries.
      - name: Download the generated trees and package manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-trees
          path: .
      - name: Use a bun CLI for the workspace install
        # The pinned bun lives in the flake devShell; this job has no Nix.
        run: npm install --global bun@1.3.13
      - name: Install workspace dependencies
        # bun, not npm: the web consumers declare tiqian-protocol and
        # tiqian-shared as workspace:*, and npm refuses that protocol with
        # EUNSUPPORTEDPROTOCOL. --ignore-scripts skips the root postinstall,
        # which would regenerate the protocol-ts tree and delete the manifest
        # boring pack wrote.
        run: bun install --ignore-scripts
      - name: Look up matrix data
        id: matrixData
        working-directory: platforms/web/server/core
        shell: bash
        run: |
          JSON_OUTPUT=$(npx neon show ci github | jq -rc .)
          if [[ -z "$JSON_OUTPUT" || "$JSON_OUTPUT" == "null" ]]; then
            echo "::error::Failed to get matrix data from 'npx neon show ci github'."
            exit 1
          fi
          {
            echo "json<<EOF"
            echo "$JSON_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Compute matrix
        id: matrix
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const rawJson = `${{ steps.matrixData.outputs.json }}`;
            if (!rawJson || rawJson === 'null') {
              core.setFailed("Matrix data JSON is empty or null.");
              return;
            }
            let platforms;
            try {
              platforms = JSON.parse(rawJson.trim());
            } catch (e) {
              core.setFailed(`Failed to parse matrix data JSON: ${e.message}`);
              return;
            }
            const matrix = [];
            if (platforms?.macOS) {
              matrix.push(...platforms.macOS.map(platform => ({
                os: "macos-latest", platform
              })));
            }
            if (platforms?.Windows) {
              matrix.push(...platforms.Windows.map(platform => ({
                os: "windows-latest", platform
              })));
            }
            if (platforms?.Linux) {
              matrix.push(...platforms.Linux.map(platform => ({
                os: platform.includes('arm64') ? "ubuntu-24.04-arm" : "ubuntu-latest",
                platform
              })));
            }
            console.log("Computed matrix:", matrix);
            if (matrix.length === 0) {
              core.setFailed("Computed build matrix is empty.");
            }
            return matrix;

  # The precompute crates read `tiqian-engine-gen` from the gitignored
  # engine-gen/ tree, and the boring driver reads tools/unicode-data/ at
  # compile time. The driver only exists in the flake devShell, and the
  # Windows runner has no Nix, so generate the tree once here and hand it
  # to every platform leg.
  engine-gen:
    name: Generate the Rust engine tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
      - name: Allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Generate the precompute engine tree with the flake toolchain
        run: nix develop -c bash -c 'bash tools/setup-haxe-env.sh && node scripts/generate-engine-gen.mjs'
      - name: Generate the TypeScript engine tree with the flake toolchain
        # tiqian-protocol and tiqian-shared are workspace:* members under
        # engine-haxe/out/{protocol-ts,shared-ts}/gen whose package.json is
        # written by boring pack, and engine-gen/ feeds the @tiqian/ffi
        # runtime. The matrix spans Windows and macOS runners with no Nix, so
        # generate the trees once here and hand every leg the result.
        run: nix develop -c bash -c 'bash tools/setup-haxe-env.sh && node scripts/generate-engine-gen.mjs ts'
      - name: Write the protocol and shared package manifests
        run: |
          export BORING_PACKAGE_TSC="$RUNNER_TEMP/boring-package-tsc"
          printf '#!/usr/bin/env bash\nexec bun x --bun typescript@5.9.3/bin/tsc "$@"\n' > "$BORING_PACKAGE_TSC"
          chmod +x "$BORING_PACKAGE_TSC"
          nix develop -c bash -c 'bash tools/setup-haxe-env.sh && boring pack protocol-ts shared-ts --project boring.json'
      - name: Upload the generated TypeScript workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-trees
          path: |
            engine-haxe/out/protocol-ts
            engine-haxe/out/shared-ts
            platforms/web/client/engine-runtime/engine-gen
          if-no-files-found: error
          retention-days: 7
      - name: Upload the generated engine tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-gen
          path: platforms/web/server/precompute/engine-gen
          if-no-files-found: error
          retention-days: 7
      - name: Upload the generated protocol tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-gen
          path: platforms/web/server/precompute/protocol-gen
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Build addon (${{ matrix.cfg.platform }})
    needs: [matrix, engine-gen]
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.cfg.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Download the generated engine tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-gen
          path: platforms/web/server/precompute/engine-gen
      - name: Download the generated protocol tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protocol-gen
          path: platforms/web/server/precompute/protocol-gen
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      # The smoke test resolves `@tiqian/prose` and `@tiqian/core` from
      # this checkout: the registry alpha predates the `./prepared-dom`
      # subpath the precompute sources import, and the emitted declarations
      # are not tracked. This lane has no Gradle step, so the ffi
      # declarations a full type check would need are absent; emit the
      # packages and the suite without checks (the Native precompute CI runs
      # the full checks over the same sources).
      - name: Download the generated trees and package manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-trees
          path: .
      - name: Use a bun CLI for the workspace install
        shell: bash
        # The pinned bun lives in the flake devShell; the matrix spans Windows
        # and macOS runners with no Nix, so install the same version from npm.
        run: npm install --global bun@1.3.13
      # Workspace install hoists @tiqian/* packages as symlinks; the matrix
      # spans Windows runners, whose default pwsh shell has no rm -rf and cannot
      # execute the extensionless .bin shims; run every step of this block under
      # bash like the build steps below.
      - name: Install workspace dependencies
        working-directory: .
        shell: bash
        # bun, not npm: the web consumers declare tiqian-protocol and
        # tiqian-shared as workspace:*, and npm refuses that protocol with
        # EUNSUPPORTEDPROTOCOL. --ignore-scripts skips the root postinstall,
        # which would regenerate the protocol-ts tree and delete the manifest
        # boring pack wrote. The root install covers server/core as a workspace
        # member, so the former server/core-local install is gone; it walked up
        # to the workspace root and failed with the same protocol error.
        run: bun install --ignore-scripts
      - name: Emit the prose packages
        working-directory: platforms/web/client/web-component
        shell: bash
        # Run the workspace TypeScript directly. npx looks for an extensionless
        # node_modules/.bin/tsc to decide whether the command is installed, and
        # bun writes only tsc.exe plus tsc.bunx on Windows, so npx falls back to
        # installing the unrelated registry `tsc` package. Resolving the
        # package through node keeps the installed compiler and fails this step
        # when the workspace does not contain it.
        run: |
          TSC="$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('typescript/package.json')), 'bin', 'tsc')")"
          node "$TSC" -b --noCheck
      - name: Build addon and place platform binary
        working-directory: platforms/web/server/core
        shell: bash
        env:
          NEON_BUILD_PLATFORM: ${{ matrix.cfg.platform }}
        run: |
          cargo build --manifest-path ../precompute/binding/Cargo.toml \
            --release --message-format=json-render-diagnostics > cargo.log
          npx neon dist --name tiqian-precompute-neon < cargo.log
          test -f "platforms/${NEON_BUILD_PLATFORM}/index.node"
      - name: Smoke test through the npm loader
        working-directory: platforms/web/server/core
        shell: bash
        run: |
          TSC="$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('typescript/package.json')), 'bin', 'tsc')")"
          node "$TSC" -p tsconfig.build.json --noCheck
          node --test "test/**/*.test.ts"
      - name: Pack platform package
        working-directory: platforms/web/server/core/platforms/${{ matrix.cfg.platform }}
        shell: bash
        run: |
          mkdir -p ../../pack-output
          PACK_OUTPUT=$(npm pack --pack-destination ../../pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the platform package."
            exit 1
          fi
          FILENAME=$(basename "$PACK_OUTPUT")
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
        id: pack
      - name: Upload platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-package-${{ matrix.cfg.platform }}
          path: platforms/web/server/core/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  main-package:
    name: Pack main package
    needs: [matrix, engine-gen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      # Same working-tree resolution as the binaries job: the registry alpha
      # predates the ./prepared-dom subpath, and the emitted declarations are
      # not tracked. This lane has no Gradle step, so the ffi declarations a
      # full type check would need are absent; build without checks and drop
      # the typecheck script (the Native precompute CI runs the full checks
      # over the same sources).
      - name: Download the generated trees and package manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-trees
          path: .
      - name: Use a bun CLI for the workspace install
        # The pinned bun lives in the flake devShell; this job has no Nix.
        run: npm install --global bun@1.3.13
      - name: Install workspace dependencies
        working-directory: .
        # bun, not npm: the web consumers declare tiqian-protocol and
        # tiqian-shared as workspace:*, and npm refuses that protocol with
        # EUNSUPPORTEDPROTOCOL. --ignore-scripts skips the root postinstall,
        # which would regenerate the protocol-ts tree and delete the manifest
        # boring pack wrote. The root install covers server/core as a workspace
        # member, so the former server/core-local install is gone; it walked up
        # to the workspace root and failed with the same protocol error.
        run: bun install --ignore-scripts
      - name: Emit the prose packages
        working-directory: platforms/web/client/web-component
        # Same resolution as the binaries job: run the workspace TypeScript
        # through node, so a missing install fails the step instead of letting
        # npx fetch the unrelated registry `tsc` package.
        run: |
          TSC="$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('typescript/package.json')), 'bin', 'tsc')")"
          node "$TSC" -b --noCheck
      - name: Lint and build the JS entry
        working-directory: platforms/web/server/core
        run: |
          npm run lint
          TSC="$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('typescript/package.json')), 'bin', 'tsc')")"
          node "$TSC" -p tsconfig.build.json --noCheck
      - name: Pack
        working-directory: platforms/web/server/core
        shell: bash
        id: pack
        run: |
          mkdir -p pack-output
          PACK_OUTPUT=$(npm pack --pack-destination pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the main package."
            exit 1
          fi
          echo "filename=$(basename "$PACK_OUTPUT")" >> "$GITHUB_OUTPUT"
      - name: Upload main package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-package
          path: platforms/web/server/core/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect packages
    needs: [binaries, main-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: collected-packages
      - name: Verify a complete package set
        run: |
          expected="binary-package-darwin-arm64 binary-package-linux-arm64-gnu binary-package-linux-x64-gnu binary-package-win32-x64-msvc main-package"
          for name in $expected; do
            if ! find collected-packages/"$name" -name '*.tgz' | grep -q .; then
              echo "::error::Artifact $name contains no package."
              exit 1
            fi
          done
      - name: Upload package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-precompute-packages
          path: collected-packages/**/*.tgz
          if-no-files-found: error
          retention-days: 7
