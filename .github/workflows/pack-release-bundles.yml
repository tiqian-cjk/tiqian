name: Pack release bundles

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string
      bundles:
        required: true
        type: string
      version:
        required: true
        type: string
      neon-run-id:
        description: Successful Neon build run on this commit
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  pack:
    name: Pack ${{ inputs.shard }}
    runs-on: ubuntu-latest
    env:
      RELEASE_BUNDLES: ${{ inputs.bundles }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_ASSET_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Restore the Gradle dependency cache from CI
        if: inputs.shard == 'maven'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up the pinned Nix toolchain
        uses: ./.github/actions/setup-release-nix

      - name: Align the package versions with the release
        run: python3 tools/align-package-versions.py "${RELEASE_VERSION}"

      - name: Download the Web sources from the successful CI run
        if: inputs.shard == 'npm' && inputs.neon-run-id != ''
        id: neon-sources
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-trees
          github-token: ${{ github.token }}
          run-id: ${{ inputs.neon-run-id }}
          path: ${{ runner.temp }}/verified-neon-sources

      - name: Reuse the Web runtime sources
        if: steps.neon-sources.outcome == 'success'
        id: reuse-web
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # The generated trees are version-neutral. Pack writes the npm manifests.
          for relative in engine-haxe/out/ts engine-haxe/out/protocol-ts engine-haxe/out/shared-ts; do
            source="$RUNNER_TEMP/verified-neon-sources/$relative"
            test -d "$source"
            mkdir -p "$(dirname "$relative")"
            cp -a "$source" "$relative"
          done

      - name: Pack and compile this shard
        shell: bash
        run: |
          set -euo pipefail
          # The flake SDK and the runner SDK must not supply conflicting Android paths.
          unset ANDROID_SDK_ROOT
          export BORING_PACKAGE_TSC="$RUNNER_TEMP/boring-package-tsc"
          printf '#!/usr/bin/env bash\nexec bun x --bun typescript@5.9.3/bin/tsc "$@"\n' > "$BORING_PACKAGE_TSC"
          chmod +x "$BORING_PACKAGE_TSC"

          # Pack invokes the TS and Kotlin compilers. Compile the other targets separately.
          nix develop -c bash -e -c '
            read -r -a bundles <<< "$RELEASE_BUNDLES"
            bash tools/setup-haxe-env.sh
            boring pack "${bundles[@]}" --registry-out "$RUNNER_TEMP/release-pack/registry-tree" \
              --owner "$GITHUB_REPOSITORY_OWNER" --repo "${GITHUB_REPOSITORY#*/}" --asset-base "$RELEASE_ASSET_BASE"
            python3 tools/compile-bundles.py --project boring.json --bundles "${bundles[@]}"
          '

      - name: Embed the repository URL in the npm manifests
        if: inputs.shard == 'npm'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/embed-repository.py --tree "$RUNNER_TEMP/release-pack/registry-tree" \
            engine-haxe/out/*/@tiqian-*.tgz

      - name: Collect the shard artifacts
        run: |
          python3 tools/collect-release-artifacts.py \
            --tree "$RUNNER_TEMP/release-pack/registry-tree" \
            --source engine-haxe/out \
            --artifacts "$RUNNER_TEMP/release-pack/release-artifacts"

      - name: Upload the shard artifacts and registry metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pack-${{ inputs.shard }}
          path: ${{ runner.temp }}/release-pack
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Web runtime and workspace inputs
        if: inputs.shard == 'npm'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-inputs
          path: |
            engine-haxe/out/ts
            engine-haxe/out/protocol-ts
            engine-haxe/out/shared-ts
          if-no-files-found: error
          retention-days: 7
