name: Publish ffi package

# Both npm lanes and the registry lane are called by .github/workflows/release.yml
# from one v*.*.* tag, and each lane runs the release gate first. The lane can
# also be dispatched on the release tag to re-publish a failed run.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-tiqian-ffi
  cancel-in-progress: false

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  publish-alpha:
    name: Verify and publish alpha
    needs: [release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    defaults:
      run:
        working-directory: platforms/web/client/engine-runtime
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.12.1

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v*.*.* ]]; then
            echo "::error::This lane runs only from a v*.*.* release tag, received ${GITHUB_REF_NAME}."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag target ${tag_commit} does not match workflow commit ${GITHUB_SHA}"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit on origin/main"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The install resolves two generated, gitignored trees: tiqian-protocol
      # and tiqian-shared are workspace:* members under
      # engine-haxe/out/{protocol-ts,shared-ts}/gen whose package.json is
      # written by boring pack, and prepack's build:runtime compiles the
      # @tiqian/ffi runtime/ declarations. npm cannot resolve the workspace
      # protocol (EUNSUPPORTEDPROTOCOL), so this lane generates the trees, packs
      # the member manifests, then installs with bun.
      #
      # The flake devShell is the only source of the boring driver, and only
      # the generation needs it. Wrapping the whole job in `nix develop` would
      # put npm test and npm publish on the devShell's Node 22 and npm 10.9.8,
      # shadowing the setup-node Node 24 and the OIDC-capable npm 11 installed
      # above; the measured wall time is the same either way because the
      # devShell startup is paid once.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: Allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Generate the TypeScript engine tree with the flake toolchain
        working-directory: .
        # engine-gen/ is a build product. Generating it before the install keeps
        # the install hook and prepack's build:runtime from regenerating the
        # protocol-ts tree, which would drop the package manifest written below.
        run: nix develop -c bash -c 'bash tools/setup-haxe-env.sh && node scripts/generate-engine-gen.mjs ts'

      - name: Write the protocol and shared package manifests
        working-directory: .
        run: |
          export BORING_PACKAGE_TSC="$RUNNER_TEMP/boring-package-tsc"
          printf '#!/usr/bin/env bash\nexec bun x --bun typescript@5.9.3/bin/tsc "$@"\n' > "$BORING_PACKAGE_TSC"
          chmod +x "$BORING_PACKAGE_TSC"
          nix develop -c bash -c 'bash tools/setup-haxe-env.sh && boring pack protocol-ts shared-ts --project boring.json'

      - name: Install workspace dependencies
        working-directory: .
        # bun, not npm: the web consumers declare tiqian-protocol and
        # tiqian-shared as workspace:*, and npm refuses that protocol with
        # EUNSUPPORTEDPROTOCOL. --ignore-scripts skips the root postinstall
        # (which would regenerate the protocol-ts tree and delete the manifest
        # boring pack wrote) and the @tiqian/ffi prepare hook; build:runtime
        # below assembles the runtime this lane ships.
        run: nix develop -c bun install --ignore-scripts

      - name: Assemble the @tiqian/ffi runtime with the flake toolchain
        working-directory: .
        # The install hook and the @tiqian/ffi prepare hook were the only
        # callers of this build, and --ignore-scripts skipped both.
        run: nix develop -c npm run build:runtime --workspace @tiqian/ffi

      - name: Build and verify the release tarball
        env:
          TIQIAN_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/tiqian-ffi-release
        run: npm run verify:release --workspace @tiqian/ffi

      - name: Publish the verified tarball to alpha
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(find "${RUNNER_TEMP}/tiqian-ffi-release" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "${tarball}" ]]; then
            echo "::error::Verified release tarball is missing"
            exit 1
          fi
          npm publish "${tarball}" --ignore-scripts --access public --tag alpha

  sync-latest:
    name: Synchronize latest dist-tag
    needs: publish-alpha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the release npm CLI
        run: npm install --global npm@11.12.1

      - name: Point latest at the published alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          RELEASE_VERSION: ${{ needs.publish-alpha.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::NPM_DIST_TAG_TOKEN is not configured"
            exit 1
          fi
          npm dist-tag add "@tiqian/ffi@${RELEASE_VERSION}" latest

      - name: Verify alpha and latest
        env:
          RELEASE_VERSION: ${{ needs.publish-alpha.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            tags="$(npm view @tiqian/ffi dist-tags --json)"
            if DIST_TAGS="${tags}" node --input-type=module -e '
              const tags = JSON.parse(process.env.DIST_TAGS);
              const version = process.env.RELEASE_VERSION;
              if (tags.alpha !== version || tags.latest !== version) process.exit(1);
            '; then
              echo "alpha and latest both point to ${RELEASE_VERSION}"
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then sleep 5; fi
          done
          echo "::error::npm dist-tags did not converge on ${RELEASE_VERSION}"
          exit 1
