name: Module tests

# Every Gradle module test source set, in one lane.
#
# Before this lane existed no workflow ran a module test: the only Gradle
# invocations in .github/workflows were assemble + publishTiqianToMavenLocal
# (publish.yml, also sourced by tools/staging-pipeline.sh),
# publishTiqianToCentral and publishTiqianToCentralSnapshots. The JUnit suites
# under platforms/ and demo/ therefore had no CI verdict at all, and the
# instrumented and Apple test sources were never compiled.
#
# The lane reports three different verdicts, because they do not prove the same
# thing:
#
#   execute      tasks whose tests run on this runner. Their pass/fail count is
#                the lane's verdict, and the lane carries no --tests filter, no
#                --exclude and no skip switch.
#   probe        assertion classes in :tools:engine-probes, which keeps them in
#                jvmMain and runs them through runProbe one class at a time.
#                They run, and their pass/fail count is part of the verdict.
#   compile only tasks whose test sources this runner can compile but cannot run.
#                androidTest and androidDeviceTest are instrumented tests and
#                need a device or emulator; the Apple Kotlin/Native tests link
#                and run only on macOS. The lane says those sources compile and
#                never reports them as passing.
#
# tools/module-test-tasks.sh holds the task sets, the probe discovery rule and
# the module-by-module reason for each entry.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-tests:
    name: Execute the host-runnable module tests and compile the rest
    runs-on: ubuntu-latest
    # A cold run generates the Kotlin engine tree, compiles 16 modules, executes
    # the JVM suites and compiles three Apple Kotlin/Native test klibs per Apple
    # module.
    timeout-minutes: 120
    steps:
      - name: Check out the commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: Allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true

      # settings.gradle.kts stops with the generation command when the generated
      # tree is missing, and the tree is gitignored, so every Gradle invocation
      # below needs this step first.
      - name: Generate the Kotlin engine sources
        run: nix develop -c bash -c 'bash tools/setup-haxe-env.sh && boring gen kotlin-f32 --project boring.json'

      - name: Show the lane definition
        shell: bash
        run: |
          set -euo pipefail
          . tools/module-test-tasks.sh
          printf 'execute:      %s\n' "${MODULE_TEST_EXECUTE_TASKS[*]}"
          printf 'probe:        %s\n' "${MODULE_TEST_PROBE_TASK}"
          printf 'probe classes: %s\n' "$(module_test_probe_classes | paste -sd ' ' -)"
          printf 'compile only: %s\n' "${MODULE_TEST_COMPILE_ONLY_TASKS[*]}"

      # skiko resolves its native library on first use and writes
      # ~/.skiko/.skiko.lock before the load. When the JVM's user.home is
      # read-only that open fails with EROFS, org.jetbrains.skiko.LibraryLoader
      # reports the consequence as an UnsatisfiedLinkError, and every
      # :platforms:compose:skia-jvm and :platforms:compose:compose test fails for
      # a reason that has nothing to do with the code under test. The lane
      # therefore hands every JVM it starts a writable user.home instead of
      # relying on the runner's HOME.
      #
      # KONAN_DATA_DIR is pinned next to that home for the same reason: the
      # Kotlin/Native distribution creates a lock file inside its own directory,
      # and a read-only default would fail the Apple compile step.
      #
      # ANDROID_SDK_ROOT is dropped before the devShell starts, as in
      # publish.yml: the runner image exports its own SDK path, and Gradle
      # refuses to configure an Android project when ANDROID_HOME and
      # ANDROID_SDK_ROOT name different roots. The devShell exports the pinned
      # SDK that the Android modules require.
      - name: Run the module tests
        shell: bash
        run: |
          set -euo pipefail
          unset ANDROID_SDK_ROOT
          module_test_home="$RUNNER_TEMP/tiqian-module-tests-home"
          mkdir -p "$module_test_home"
          export JAVA_TOOL_OPTIONS="-Duser.home=$module_test_home"
          export KONAN_DATA_DIR="$module_test_home/.konan"
          nix develop -c bash -c '
            set -euo pipefail
            . tools/module-test-tasks.sh
            ./gradlew "${MODULE_TEST_EXECUTE_TASKS[@]}" --continue --no-daemon
          '

      # :tools:engine-probes keeps its assertion classes in jvmMain, so
      # :tools:engine-probes:jvmTest is NO-SOURCE and the task step above cannot
      # reach them. runProbe takes one class name per invocation, so this step
      # pays one build configuration per class; the class list comes from the
      # source tree (module_test_probe_classes), not from a hand-kept list.
      - name: Run the probe assertion classes
        shell: bash
        run: |
          set -euo pipefail
          unset ANDROID_SDK_ROOT
          module_test_home="$RUNNER_TEMP/tiqian-module-tests-home"
          mkdir -p "$module_test_home"
          export JAVA_TOOL_OPTIONS="-Duser.home=$module_test_home"
          export KONAN_DATA_DIR="$module_test_home/.konan"
          nix develop -c bash -c '
            set -euo pipefail
            . tools/module-test-tasks.sh
            mapfile -t probe_classes < <(module_test_probe_classes)
            for probe_class in "${probe_classes[@]}"; do
              ./gradlew "$MODULE_TEST_PROBE_TASK" -PprobeClass="$probe_class" --no-daemon
            done
          '

      # Compile-only tasks still run when the test step is red, so one failing
      # JUnit case does not hide whether the instrumented and Apple test sources
      # compile.
      - name: Compile the test sources that cannot run on this runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          unset ANDROID_SDK_ROOT
          module_test_home="$RUNNER_TEMP/tiqian-module-tests-home"
          mkdir -p "$module_test_home"
          export JAVA_TOOL_OPTIONS="-Duser.home=$module_test_home"
          export KONAN_DATA_DIR="$module_test_home/.konan"
          nix develop -c bash -c '
            set -euo pipefail
            . tools/module-test-tasks.sh
            ./gradlew "${MODULE_TEST_COMPILE_ONLY_TASKS[@]}" --continue --no-daemon
          '
