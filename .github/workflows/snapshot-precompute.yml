name: Snapshot precompute packages

# Manual-only snapshot lane for the full npm set: precompute and its platform
# binaries, the astro and sveltekit integrations, and the ffi, core, prose,
# and react client packages. Each dispatch stamps its own timestamped tag,
# builds the eleven packages from that commit, temporarily swaps the manifests
# to the running repository owner's scope (GitHub Packages requires the npm
# scope to equal the owner), publishes the timestamped versions with the
# `snapshot` dist-tag, and restores the manifests. Snapshot publishing
# belongs to the fork; the stamp job refuses to run under the canonical
# owner. Release publishing stays in publish-precompute.yml and
# publish-prose.yml and never runs the swap.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-precompute
  cancel-in-progress: false

jobs:
  stamp:
    name: Stamp snapshot tag and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      tag: ${{ steps.stamp.outputs.tag }}
      commit: ${{ steps.stamp.outputs.commit }}
    steps:
      # Snapshot publishing is test publishing and belongs to the fork, where
      # the scope follows the fork owner; the canonical repository keeps the
      # @tiqian release lane only.
      - name: Refuse to run under the canonical owner
        shell: bash
        run: |
          if [[ "${GITHUB_REPOSITORY_OWNER}" == "tiqian-cjk" ]]; then
            echo "::error::Snapshot publishing runs only on forks (owner-scoped packages); dispatch it on a fork, never on the canonical repository."
            exit 1
          fi

      - name: Check out the dispatched commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify manifest set and push the timestamped tag
        id: stamp
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base="$(node -p "require('./platforms/web/server/core/package.json').version.split('-')[0]")"
          for platform in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            platform_base="$(node -p "require('./platforms/web/server/core/platforms/${platform}/package.json').version.split('-')[0]")"
            if [[ "${platform_base}" != "${base}" ]]; then
              echo "::error::Platform ${platform} is at ${platform_base}, expected ${base}"
              exit 1
            fi
          done
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          version="${base}-snapshot.${stamp}"
          tag="npm-snapshot-${stamp}"
          git tag -a "${tag}" -m "npm snapshot ${version}"
          git push origin "${tag}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  engine-linux:
    name: Build engine archives and ffi runtime
    runs-on: ubuntu-latest
    needs: [stamp]
    steps:
      - name: Check out the stamped commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.stamp.outputs.commit }}

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android platform pieces
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-snapshot-precompute-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-snapshot-precompute-
            konan-${{ runner.os }}-

      - name: Link static libraries and assemble the ffi runtime
        run: >
          ./gradlew
          :ffi:native:linkReleaseStaticLinuxX64
          :ffi:native:linkReleaseStaticLinuxArm64
          :ffi:js:assembleNpmPackage

      - name: Upload the ffi npm runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-runtime
          path: ffi/js/npm/runtime
          if-no-files-found: error
          retention-days: 7

      - name: Upload linuxX64 engine archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-linuxX64
          path: ffi/native/build/bin/linuxX64/releaseStatic
          if-no-files-found: error
          retention-days: 7

      - name: Upload linuxArm64 engine archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-linuxArm64
          path: ffi/native/build/bin/linuxArm64/releaseStatic
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Build addon (${{ matrix.platform }})
    needs: [stamp, engine-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-latest
            engine-archive: engine-linuxX64
          - platform: linux-arm64-gnu
            os: ubuntu-24.04-arm
            engine-archive: engine-linuxArm64
          - platform: darwin-arm64
            os: macos-latest
            engine-archive: ""
          - platform: win32-x64-msvc
            os: windows-latest
            engine-archive: ""
    runs-on: ${{ matrix.os }}
    env:
      SNAPSHOT_VERSION: ${{ needs.stamp.outputs.version }}
      SNAPSHOT_SCOPE: "@${{ github.repository_owner }}"
    steps:
      - name: Check out the stamped commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.stamp.outputs.commit }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download the engine archive
        if: matrix.engine-archive != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.engine-archive }}
          path: engine

      # The smoke test's pretest build consumes the ffi type declarations, a
      # Gradle product. The runtime is host-independent JS, so reuse the
      # archive built once on linux instead of installing a JDK and the
      # Android SDK on every matrix leg.
      - name: Download the ffi npm runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffi-runtime
          path: ffi/js/npm/runtime

      # Root install, not a server/core-local one: the smoke test's pretest
      # build consumes workspace members through their dev links.
      - name: Install workspace dependencies
        working-directory: .
        run: npm install --no-audit --no-fund

      # The smoke test's pretest build consumes prose's prepared-dom, whose
      # project references consume core's declarations; a fresh checkout
      # carries neither emit, so build that chain first (same order as
      # ci-native-precompute.yml).
      - name: Build core with full type checks
        working-directory: platforms/web/client/core
        run: npx tsc -b

      - name: Emit the prose package
        working-directory: platforms/web/client/web-component
        run: npx tsc -b --noCheck

      # An empty TIQIAN_NATIVE_LIB_DIR keeps the engine call compiled out for
      # the platforms without a wired engine link; the font session and the
      # registry entries still load and smoke test.
      - name: Build addon and place platform binary
        working-directory: platforms/web/server/core
        shell: bash
        env:
          NEON_BUILD_PLATFORM: ${{ matrix.platform }}
          TIQIAN_NATIVE_LIB_DIR: ${{ matrix.engine-archive != '' && format('{0}/engine', github.workspace) || '' }}
        run: |
          cargo build --manifest-path ../precompute/binding/Cargo.toml \
            --release --message-format=json-render-diagnostics > cargo.log
          npx neon dist --name tiqian-precompute-neon < cargo.log
          test -f "platforms/${NEON_BUILD_PLATFORM}/index.node"

      - name: Smoke test through the npm loader
        working-directory: platforms/web/server/core
        shell: bash
        run: npm test

      - name: Apply the snapshot manifest swap
        id: swap
        working-directory: platforms/web/server/core
        # Bash keeps ${VAR} expansion off PowerShell, which sees an empty
        # string for the shell-variable syntax. npm scopes are lowercase, and
        # macOS ships Bash 3.2 without the ,, expansion, so tr lowercases.
        shell: bash
        run: |
          scope="$(printf '%s' "${SNAPSHOT_SCOPE}" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          node snapshot-swap.ts apply "${SNAPSHOT_VERSION}" "${scope}" "${repository}"

      - name: Pack platform package
        working-directory: platforms/web/server/core/platforms/${{ matrix.platform }}
        shell: bash
        run: |
          mkdir -p ../../pack-output
          PACK_OUTPUT=$(npm pack --pack-destination ../../pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the platform package."
            exit 1
          fi
          FILENAME=$(basename "$PACK_OUTPUT")
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
        id: pack

      - name: Restore the manifests
        if: ${{ always() && steps.swap.outcome == 'success' }}
        working-directory: platforms/web/server/core
        run: node snapshot-swap.ts restore

      - name: Upload platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-package-${{ matrix.platform }}
          path: platforms/web/server/core/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  main-package:
    name: Pack main package
    needs: [stamp]
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_VERSION: ${{ needs.stamp.outputs.version }}
      SNAPSHOT_SCOPE: "@${{ github.repository_owner }}"
    steps:
      - name: Check out the stamped commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.stamp.outputs.commit }}

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android platform pieces
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-snapshot-main-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # The build chain below starts at the ffi type declarations, a Gradle
      # product the checkout does not carry (ffi/js/npm/runtime is
      # gitignored).
      - name: Assemble the ffi npm runtime
        run: ./gradlew :ffi:js:assembleNpmPackage

      # Root install, not a server/core-local one: the build below consumes
      # workspace members through their dev links.
      - name: Install workspace dependencies
        working-directory: .
        run: npm install --no-audit --no-fund

      # The precompute build consumes prose's prepared-dom, whose project
      # references consume core's declarations; a fresh checkout carries
      # neither emit, so build that chain first (same order as
      # ci-native-precompute.yml).
      - name: Build core with full type checks
        working-directory: platforms/web/client/core
        run: npx tsc -b

      - name: Emit the prose package
        working-directory: platforms/web/client/web-component
        run: npx tsc -b --noCheck

      - name: Lint, typecheck, and build the JS entry
        working-directory: platforms/web/server/core
        run: |
          npm run lint
          npm run build
          npm run typecheck

      - name: Apply the snapshot manifest swap
        id: swap
        working-directory: platforms/web/server/core
        # Bash keeps ${VAR} expansion off PowerShell, which sees an empty
        # string for the shell-variable syntax. npm scopes are lowercase, and
        # macOS ships Bash 3.2 without the ,, expansion, so tr lowercases.
        shell: bash
        run: |
          scope="$(printf '%s' "${SNAPSHOT_SCOPE}" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          node snapshot-swap.ts apply "${SNAPSHOT_VERSION}" "${scope}" "${repository}"

      - name: Pack
        working-directory: platforms/web/server/core
        shell: bash
        id: pack
        run: |
          mkdir -p pack-output
          PACK_OUTPUT=$(npm pack --pack-destination pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the main package."
            exit 1
          fi
          echo "filename=$(basename "$PACK_OUTPUT")" >> "$GITHUB_OUTPUT"

      - name: Restore the manifests
        if: ${{ always() && steps.swap.outcome == 'success' }}
        working-directory: platforms/web/server/core
        run: node snapshot-swap.ts restore

      - name: Upload main package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-package
          path: platforms/web/server/core/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  integration-packages:
    name: Pack astro and sveltekit integrations
    needs: [stamp]
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_VERSION: ${{ needs.stamp.outputs.version }}
      SNAPSHOT_SCOPE: "@${{ github.repository_owner }}"
    steps:
      - name: Check out the stamped commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.stamp.outputs.commit }}

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android platform pieces
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-snapshot-integration-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # The build chain below starts at the ffi type declarations, a Gradle
      # product the checkout does not carry (ffi/js/npm/runtime is
      # gitignored).
      - name: Assemble the ffi npm runtime
        run: ./gradlew :ffi:js:assembleNpmPackage

      # Root install: the build below consumes workspace members through
      # their dev links.
      - name: Install workspace dependencies
        working-directory: .
        run: npm install --no-audit --no-fund

      # The precompute build consumes prose's prepared-dom, whose project
      # references consume core's declarations; a fresh checkout carries
      # neither emit, so build that chain first (same order as
      # ci-native-precompute.yml).
      - name: Build core with full type checks
        working-directory: platforms/web/client/core
        run: npx tsc -b

      - name: Emit the prose package
        working-directory: platforms/web/client/web-component
        run: npx tsc -b --noCheck

      # The integration dev links point at the precompute package in the
      # checkout, whose `lib/` build output the sources import through the
      # export map; a fresh checkout ships only `src/`, so build it first.
      - name: Build the precompute library
        working-directory: platforms/web/server/core
        run: npm run build

      # The published artifact of both integrations is the tsc dist output
      # (files list dist, the export map points into it), and both test
      # suites import their own dist modules, so build it before the tests.
      # The pack step below skips prepack, whose test half would fail on
      # the swapped manifests, so the dist output also has to exist on disk
      # before the swap.
      - name: Build the integration dist outputs
        working-directory: platforms/web/client
        run: |
          (cd astro && npx tsc -p .)
          (cd sveltekit && npx tsc -p .)

      # The integration suites assert the canonical manifest set (peer
      # versions against the precompute and prose manifests), so they run
      # before the swap flips names and versions.
      - name: Install and test @tiqian/astro
        working-directory: platforms/web/client/astro
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Install and test @tiqian/sveltekit
        working-directory: platforms/web/client/sveltekit
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Apply the snapshot manifest swap
        id: swap
        working-directory: platforms/web/server/core
        # Bash keeps ${VAR} expansion off PowerShell, which sees an empty
        # string for the shell-variable syntax. npm scopes are lowercase.
        shell: bash
        run: |
          scope="$(printf '%s' "${SNAPSHOT_SCOPE}" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          node snapshot-swap.ts apply "${SNAPSHOT_VERSION}" "${scope}" "${repository}"

      # The swapped tree fails the manifest assertions above by design; pack
      # without scripts and rely on the pre-swap test runs and on the dist
      # outputs built before the swap.
      - name: Pack both integrations
        working-directory: platforms/web/client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pack-output
          for integration in astro sveltekit; do
            (cd "${integration}" && npm pack --ignore-scripts --pack-destination ../pack-output)
          done
          test "$(find pack-output -name '*.tgz' | wc -l)" -eq 2
          astro_tarball="$(find pack-output -name '*astro*.tgz' -print -quit)"
          sveltekit_tarball="$(find pack-output -name '*sveltekit*.tgz' -print -quit)"
          # Grep saved listings, not a pipe: grep -q exits on the match while
          # tar still writes, and pipefail turns the SIGPIPE into a failure.
          listing="pack-output/listing.txt"
          tar -tzf "${astro_tarball}" > "${listing}"
          grep -q '^package/dist/integration.js$' "${listing}"
          tar -tzf "${sveltekit_tarball}" > "${listing}"
          grep -q '^package/dist/server.js$' "${listing}"
          rm -f "${listing}"

      - name: Restore the manifests
        if: ${{ always() && steps.swap.outcome == 'success' }}
        working-directory: platforms/web/server/core
        run: node snapshot-swap.ts restore

      - name: Upload integration packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-packages
          path: platforms/web/client/pack-output/*.tgz
          if-no-files-found: error
          retention-days: 7

  client-packages:
    name: Pack ffi, core, prose, and react packages
    needs: [stamp]
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_VERSION: ${{ needs.stamp.outputs.version }}
      SNAPSHOT_SCOPE: "@${{ github.repository_owner }}"
    steps:
      - name: Check out the stamped commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.stamp.outputs.commit }}

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android platform pieces
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-snapshot-client-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/gradle-daemon-jvm.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # The ffi package ships the Kotlin/JS runtime that :ffi:js assembles
      # into the gitignored npm/runtime directory; a checkout carries none of
      # it, and the --ignore-scripts pack below never rebuilds it.
      - name: Assemble the ffi npm runtime
        run: ./gradlew :ffi:js:assembleNpmPackage

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      # Root install covers every workspace member; each package's pretest
      # then emits the .js/.d.ts build products its tarball ships.
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      # The suites assert the canonical @tiqian manifests and resolve the
      # workspace dev links, so they all run before the swap. The order
      # satisfies the build chain: prose and react consume core's emitted
      # declarations through tsc -b.
      - name: Test @tiqian/core
        working-directory: platforms/web/client/core
        run: npm test

      - name: Test @tiqian/prose
        working-directory: platforms/web/client/web-component
        run: npm test

      - name: Test @tiqian/react
        working-directory: platforms/web/client/react
        run: npm test

      - name: Test @tiqian/ffi
        working-directory: ffi/js/npm
        run: npm test

      - name: Apply the snapshot manifest swap
        id: swap
        working-directory: platforms/web/server/core
        # Bash keeps ${VAR} expansion off PowerShell, which sees an empty
        # string for the shell-variable syntax. npm scopes are lowercase.
        shell: bash
        run: |
          scope="$(printf '%s' "${SNAPSHOT_SCOPE}" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          node snapshot-swap.ts apply "${SNAPSHOT_VERSION}" "${scope}" "${repository}"

      # prose and ffi declare verify prepacks that assert the canonical
      # manifest set, and every package's emitted build products were made
      # before the swap, so all four pack without scripts. The content
      # assertions grep a saved listing: piping tar straight into grep -q
      # lets grep exit on the match while tar still writes, and pipefail
      # turns the resulting SIGPIPE into a step failure.
      - name: Pack the four packages
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/client-pack-output"
          mkdir -p "${out}"
          (cd ffi/js/npm && npm pack --ignore-scripts --pack-destination "${out}")
          (cd platforms/web/client/core && npm pack --ignore-scripts --pack-destination "${out}")
          (cd platforms/web/client/web-component && npm pack --ignore-scripts --pack-destination "${out}")
          (cd platforms/web/client/react && npm pack --ignore-scripts --pack-destination "${out}")
          test "$(find "${out}" -name '*.tgz' | wc -l)" -eq 4
          ffi_tarball="$(find "${out}" -name '*ffi*.tgz' -print -quit)"
          core_tarball="$(find "${out}" -name '*core*.tgz' -print -quit)"
          prose_tarball="$(find "${out}" -name '*prose*.tgz' -print -quit)"
          react_tarball="$(find "${out}" -name '*react*.tgz' -print -quit)"
          listing="${out}/listing.txt"
          tar -tzf "${ffi_tarball}" > "${listing}"
          grep -q '^package/runtime/Tiqian-tiqian-ffi-js.mjs$' "${listing}"
          tar -tzf "${core_tarball}" > "${listing}"
          grep -q '^package/src/' "${listing}"
          tar -tzf "${prose_tarball}" > "${listing}"
          grep -q '^package/element.js$' "${listing}"
          tar -tzf "${react_tarball}" > "${listing}"
          grep -q '^package/binding.js$' "${listing}"
          rm -f "${listing}"

      - name: Restore the manifests
        if: ${{ always() && steps.swap.outcome == 'success' }}
        working-directory: platforms/web/server/core
        run: node snapshot-swap.ts restore

      - name: Upload client packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-packages
          path: client-pack-output/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish snapshot tarballs to GitHub Packages
    needs: [stamp, binaries, main-package, integration-packages, client-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SNAPSHOT_VERSION: ${{ needs.stamp.outputs.version }}
      SNAPSHOT_SCOPE: "@${{ github.repository_owner }}"
    steps:
      - name: Set up Node.js 24 for GitHub Packages
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages

      - name: Verify a complete package set
        shell: bash
        run: |
          set -euo pipefail
          expected="binary-package-darwin-arm64 binary-package-linux-arm64-gnu binary-package-linux-x64-gnu binary-package-win32-x64-msvc main-package integration-packages client-packages"
          for name in $expected; do
            if ! find "packages/$name" -name '*.tgz' | grep -q .; then
              echo "::error::Artifact $name contains no package."
              exit 1
            fi
          done
          while IFS= read -r -d '' tarball; do
            if [[ "$(basename "$tarball")" != *"-${SNAPSHOT_VERSION}.tgz" ]]; then
              echo "::error::$(basename "$tarball") does not carry version ${SNAPSHOT_VERSION}."
              exit 1
            fi
          done < <(find packages -name '*.tgz' -print0)

      # Publish in dependency order so every version resolves as it lands:
      # ffi first (core imports it at runtime), then core (prose and react
      # depend on it), then the platform binaries (the main package lists
      # them as optional dependencies at the same version), then the main
      # package, and finally the integrations that peer on the snapshot
      # precompute and prose.
      - name: Publish each tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          publish_from() {
            tarball="$(find "packages/$1" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
            npm publish "${tarball}" --ignore-scripts --access public --tag snapshot
          }
          for pattern in '*ffi*.tgz' '*core*.tgz' '*prose*.tgz' '*react*.tgz'; do
            tarball="$(find packages/client-packages -maxdepth 1 -type f -name "${pattern}" -print -quit)"
            npm publish "${tarball}" --ignore-scripts --access public --tag snapshot
          done
          for name in binary-package-darwin-arm64 binary-package-linux-arm64-gnu binary-package-linux-x64-gnu binary-package-win32-x64-msvc; do
            publish_from "${name}"
          done
          publish_from main-package
          while IFS= read -r tarball; do
            npm publish "${tarball}" --ignore-scripts --access public --tag snapshot
          done < <(find packages/integration-packages -maxdepth 1 -type f -name '*.tgz' | sort)

      - name: Report the install line
        shell: bash
        run: |
          scope="$(printf '%s' "${SNAPSHOT_SCOPE}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "### npm snapshot published"
            echo ""
            echo '```sh'
            echo "npm install \\"
            for package in ffi core prose react precompute astro sveltekit; do
              echo "  ${scope}/${package}@${SNAPSHOT_VERSION} \\"
            done
            echo "  --registry=https://npm.pkg.github.com"
            echo '```'
            echo ""
            echo "Tag: \`${{ needs.stamp.outputs.tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
