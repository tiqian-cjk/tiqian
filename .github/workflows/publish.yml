name: Stage Tiqian Maven release

# Staged by .github/workflows/release.yml from the v*.*.* release tag, so one
# version number covers Maven too. The Central Portal deployment still needs a
# human to press publish in the Portal UI; staging and the preflight tests run
# inside the release. The workflow can also be dispatched on a release tag to
# re-stage a failed run.
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      namespace:
        description: Central Portal namespace
        required: false
        default: org.tiqian
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Maven release version
        required: true
        type: string
      namespace:
        description: Central Portal namespace
        required: true
        default: org.tiqian
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: stage-tiqian-maven-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  stage:
    needs: [release-gate]
    runs-on: ubuntu-latest
    env:
      TIQIAN_VERSION: ${{ inputs.version }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check out Tiqian
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_call" ]]; then
            if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v*.*.* ]]; then
              echo "::error::The release workflow runs only from a v*.*.* release tag."
              exit 1
            fi
            if [[ "${TIQIAN_VERSION}" == v* ]]; then
              echo "::error::The caller must pass the version without the v prefix."
              exit 1
            fi
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "${TIQIAN_VERSION}" != "${tag_version}" ]]; then
              echo "::error::Input version ${TIQIAN_VERSION} does not match the release tag ${GITHUB_REF_NAME}."
              exit 1
            fi
          fi
          if [[ "$TIQIAN_VERSION" == *-SNAPSHOT ]]; then
            echo "Central staging requires an immutable non-SNAPSHOT version." >&2
            exit 1
          fi
          for variable in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required release secret $variable is missing." >&2
              exit 1
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install CMake 4.3.2 for Android native font
        run: |
          python3 -m venv "$HOME/cmake-venv"
          "$HOME/cmake-venv/bin/pip" install --quiet "cmake==4.3.2"
          cmake_bin_dir="$("$HOME/cmake-venv/bin/python" -c 'import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), "data", "bin"))')"
          echo "$cmake_bin_dir" >> "$GITHUB_PATH"
          "$cmake_bin_dir/cmake" --version

      # engine-haxe is the only active engine source. The platforms/engine
      # module compiles the Kotlin that boring generates from engine-haxe/src
      # and this workflow publishes that module as tiqian-engine. The module
      # declares no test source sets: the generated test suite (bundle
      # kotlin-f32, gen-tests) runs through the boring driver's test lane below.
      #
      # That generated Kotlin tree is not in git: .gitignore excludes
      # /engine-haxe/out/, and platforms/engine/build.gradle.kts:53 points the
      # commonMain srcDirs at engine-haxe/out/kotlin-f32/gen. A clean checkout
      # therefore has no sources for the module, and the assemble and publish
      # tasks below would compile an empty source set. Generate the tree in this
      # job before Gradle runs; gates.sh remains the development CI entry point
      # and is not used here.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: Allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Generate the Kotlin engine sources
        run: nix develop -c bash -c 'bash tools/setup-haxe-env.sh && boring gen kotlin-f32 --project boring.json'

      # The generated suite is not a JUnit suite: every case carries
      # @boring.test.Test, and the driver's test lane compiles gen-tests through
      # its kotlin launcher and exits non-zero when any case throws. The lane ran
      # inside this repository through the module's generatedTestSuite task
      # before the module moved to platforms/engine and dropped that task.
      - name: Run the generated Kotlin test suite
        run: nix develop -c bash -c 'boring test kotlin-f32 --project boring.json'

      # The Gradle steps run with the Android SDK the flake devShell exports,
      # because the runner image's SDK cannot satisfy the Android modules.
      # platforms/android/native-font/build.gradle.kts:19 pins
      # ndkVersion 29.0.13599879-rc2 and :34 pins cmake version 3.22.1; the
      # ubuntu-latest image preinstalls NDK 27.3.13750724, 29.0.14206865 and
      # 30.0.16248370 only, and no sdkmanager call in this workflow installs
      # the pinned one. flake.nix:50-59 composes exactly platforms;android-36,
      # build-tools;36.0.0, cmake;3.22.1 and ndk;29.0.13599879-rc2, and
      # flake.nix:100-101 exports that SDK as ANDROID_HOME.
      # Gradle refuses to configure any Android project when ANDROID_HOME and
      # ANDROID_SDK_ROOT name different roots ("Several environment variables
      # and/or system properties contain different paths to the SDK"), and the
      # image exports ANDROID_SDK_ROOT=/usr/local/lib/android/sdk, so that
      # variable is dropped before the devShell starts, as in
      # staging-pipeline.yml:77.
      - name: Verify the engine and the release artifacts
        shell: bash
        run: |
          unset ANDROID_SDK_ROOT
          nix develop -c bash -c '
            ./gradlew \
              assemble \
              publishTiqianToMavenLocal \
              -Dmaven.repo.local="$RUNNER_TEMP/tiqian-maven-preflight" \
              --no-daemon
          '

      # The Central upload publishes the same Android modules, so this step
      # needs the same SDK and the same unset.
      - name: Upload Tiqian modules
        shell: bash
        run: |
          unset ANDROID_SDK_ROOT
          nix develop -c bash -c './gradlew publishTiqianToCentral --no-daemon'

      - name: Create Central Portal deployment
        env:
          CENTRAL_NAMESPACE: ${{ inputs.namespace }}
        shell: bash
        run: |
          set -euo pipefail
          authorization="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          curl --fail-with-body --retry 3 \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$CENTRAL_NAMESPACE?publishing_type=user_managed"
