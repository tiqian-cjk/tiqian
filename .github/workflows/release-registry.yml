name: Release to Registry
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-registry-${{ github.ref }}
  cancel-in-progress: false

env:
  R2_ENDPOINT: https://91a3e85bc149574f96f64f55aa2c900e.r2.cloudflarestorage.com
  R2_BUCKET: tiqian-registry
  REGISTRY_REPO: tiqian-cjk/registry

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tiqian
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Stage the pinned generation inputs
        # Two inputs live outside git and are read at compile time:
        #   tools/unicode-data/            (.gitignore:63) read by reflaxe.unicode.GraphemeData
        #   engine-haxe/baseline-goldens/  (.gitignore:47) read by GoldenDataMacros.init()
        # The Unicode files come from the pinned boring checkout. The golden
        # directories are byte-identical to the tracked Kotlin recordings under
        # engine/src/jvmTest/resources/golden, so they are copied from there.
        run: |
          nix develop -c bash -c 'mkdir -p tools/unicode-data && cp -a .haxelib/boring/git/tools/unicode-data/. tools/unicode-data/'
          mkdir -p engine-haxe/baseline-goldens
          cp -a engine/src/jvmTest/resources/golden/. engine-haxe/baseline-goldens/
          ls -l tools/unicode-data
          ls engine-haxe/baseline-goldens

      - name: Build packages via boring
        # Only the bundles that declare package metadata can be packed; the five
        # app-facing targets still need names and versions declared in boring.json.
        run: nix develop -c bash -c "boring pack protocol-rust protocol-ts protocol-kotlin protocol-c engine-rust-f32 engine-rust-f64 ts kotlin-f32 kotlin-f64 swift-f32 swift-f64 dart"

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          # Prefix every artifact with its bundle id: engine-rust-f32 and
          # engine-rust-f64 both emit tiqian-engine-gen-0.1.0.crate, and a plain
          # copy would silently keep only one of them.
          find engine-haxe/out \( -name "*.tgz" -o -name "*.jar" -o -name "*.crate" -o -name "*.zip" \) | while read -r f; do
            bundle=$(echo "$f" | sed -E 's#^engine-haxe/out/([^/]+)/.*#\1#')
            cp "$f" "release-artifacts/${bundle}-$(basename "$f")"
          done
          test -n "$(ls -A release-artifacts)" || { echo "no pack artifacts were produced"; exit 1; }
          # Every packed bundle must appear in the artifact set. A rename or a
          # duplicate package name would otherwise drop one bundle without
          # making the job fail.
          for bundle in protocol-rust protocol-ts protocol-kotlin protocol-c engine-rust-f32 engine-rust-f64 ts kotlin-f32 kotlin-f64 swift-f32 swift-f64 dart; do
            ls release-artifacts | grep -q "^${bundle}-" || { echo "no artifact for bundle $bundle"; exit 1; }
          done
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write registry metadata
        # The registry tool accepts one package per version and platform
        # (packages/registry/src/registry/Core.hx:280), so each package owns a
        # repository layer and the tree path is <owner>/<package>/<version>/<platform>.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 tools/registry-metadata.py \
            --project boring.json \
            --artifacts release-artifacts \
            --version "$VERSION" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --asset-base "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            --out "$RUNNER_TEMP/registry-tree"

      - name: Commit metadata to registry repo
        run: |
          git clone https://x-access-token:${{ secrets.REGISTRY_REPO_TOKEN }}@github.com/${{ env.REGISTRY_REPO }}.git /tmp/registry
          VERSION=${GITHUB_REF_NAME#v}
          OWNER="${{ github.repository_owner }}"
          rm -rf "/tmp/registry/$OWNER"
          cp -a "$RUNNER_TEMP/registry-tree/$OWNER" "/tmp/registry/$OWNER"
          cd /tmp/registry
          git config user.name "Release Bot"
          git config user.email "release@tiqian.dev"
          git add .
          # A re-run for the same tag finds the metadata already committed;
          # an empty commit would exit non-zero and fail the job.
          if git diff --cached --quiet; then
            echo "registry metadata for $VERSION is already current"
          else
            git commit -m "release: ${{ github.repository }} ${{ github.ref_name }}"
            git push origin main
          fi
      - name: Sync compiled registry tool to registry repo
        run: |
          if [ -d packages/registry/gen ]; then
            cd /tmp/registry
            rm -rf tool
            mkdir -p tool
            cp -r $GITHUB_WORKSPACE/packages/registry/gen/* tool/
            cp $GITHUB_WORKSPACE/packages/registry/run.ts tool/
            git add tool
            git diff --cached --quiet || git commit -m 'sync: registry tool'
            git push origin main
          fi
