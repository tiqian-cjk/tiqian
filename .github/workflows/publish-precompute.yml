name: Publish precompute packages

# Release workflow for @tiqian/precompute and its four platform packages
# (ADR 0050). The addons build the generated Rust engine directly through
# platforms/web/server/precompute/binding, which consumes the boring
# engine-rust bundle; the legacy Kotlin/Native C ABI engine archive is
# retired with the Stage1 cutover.
# Called by .github/workflows/release.yml from the v*.*.* release tag, after
# the web-component lane published the @tiqian/web-component version this package pins, and
# gated before publishing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-tiqian-precompute
  cancel-in-progress: false

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  validate:
    name: Validate release tag
    needs: [release-gate]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release tag and package set
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v*.*.* ]]; then
            echo "::error::This lane runs only from a v*.*.* release tag, received ${GITHUB_REF_NAME}."
            exit 1
          fi
          version="$(node -p "require('./platforms/web/server/core/package.json').version")"
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Release tag must be annotated"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag target ${tag_commit} does not match workflow commit ${GITHUB_SHA}"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit on origin/main"
            exit 1
          fi
          for platform in darwin-arm64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            platform_name="$(node -p "require('./platforms/web/server/core/platforms/${platform}/package.json').name")"
            platform_version="$(node -p "require('./platforms/web/server/core/platforms/${platform}/package.json').version")"
            if [[ "${platform_name}" != "@tiqian/precompute-${platform}" || "${platform_version}" != "${version}" ]]; then
              echo "::error::Platform package ${platform} is ${platform_name}@${platform_version}, expected @tiqian/precompute-${platform}@${version}"
              exit 1
            fi
          done
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  # The install resolves generated, gitignored trees that need the flake
  # driver: the Rust engine and protocol crates the addon links, the
  # tiqian-protocol and tiqian-shared workspace members (their package.json is
  # written by boring pack), and the @tiqian/ffi engine-gen/ tree. The Windows
  # and macOS legs have no Nix, so generate once here and hand every leg the
  # result.
  manifests:
    name: Generate the trees and package manifests
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
      - name: Allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Generate the Rust and TypeScript engine trees with the flake toolchain
        run: nix develop -c bash -c 'bash tools/setup-haxe-env.sh && node tools/generate-engine-gen.mjs && node tools/generate-engine-gen.mjs ts'

      - name: Write the protocol and shared package manifests
        # boring pack writes the package.json that makes engine-haxe/out/
        # {protocol-ts,shared-ts}/gen resolvable workspace members; its
        # package-tsc step runs the pinned TypeScript through the devShell bun.
        run: |
          export BORING_PACKAGE_TSC="$RUNNER_TEMP/boring-package-tsc"
          printf '#!/usr/bin/env bash\nexec bun x --bun typescript@5.9.3/bin/tsc "$@"\n' > "$BORING_PACKAGE_TSC"
          chmod +x "$BORING_PACKAGE_TSC"
          nix develop -c bash -c 'bash tools/setup-haxe-env.sh && boring pack protocol-ts shared-ts --project boring.json'

      - name: Upload the generated trees and manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-trees
          path: |
            engine-haxe/out/protocol-ts
            engine-haxe/out/shared-ts
            platforms/web/server/precompute/engine-gen
            platforms/web/server/precompute/protocol-gen
            platforms/web/client/engine-runtime/engine-gen
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Build addon (${{ matrix.platform }})
    needs: [validate, manifests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-latest
          - platform: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - platform: darwin-arm64
            os: macos-latest
          - platform: win32-x64-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download the generated trees and package manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-trees
          path: .

      - name: Use a bun CLI for the workspace install
        # The pinned bun lives in the flake devShell; the Windows and macOS
        # legs have no Nix, so install the same version from npm.
        run: npm install --global bun@1.3.13

      - name: Install workspace dependencies
        working-directory: .
        # bun, not npm: the web consumers declare tiqian-protocol and
        # tiqian-shared as workspace:*, and npm refuses that protocol with
        # EUNSUPPORTEDPROTOCOL. --ignore-scripts skips the root postinstall,
        # which would regenerate the protocol-ts tree and delete the manifest
        # boring pack wrote; the generated trees come from the manifests job.
        run: bun install --ignore-scripts

      - name: Assemble the @tiqian/ffi runtime
        # The skipped install hook used to compile the @tiqian/ffi runtime/
        # declarations this smoke test resolves; engine-gen/ is already in the
        # downloaded tree, so no boring driver is needed here.
        working-directory: platforms/web/client/engine-runtime
        run: npm run build:runtime

      - name: Build addon and place platform binary
        working-directory: platforms/web/server/core
        shell: bash
        env:
          NEON_BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          cargo build --manifest-path ../precompute/binding/Cargo.toml \
            --release --message-format=json-render-diagnostics > cargo.log
          npx neon dist --name tiqian-precompute-neon < cargo.log
          test -f "platforms/${NEON_BUILD_PLATFORM}/index.node"

      - name: Smoke test through the npm loader
        working-directory: platforms/web/server/core
        shell: bash
        run: npm test

      - name: Pack platform package
        working-directory: platforms/web/server/core/platforms/${{ matrix.platform }}
        shell: bash
        run: |
          mkdir -p ../../pack-output
          PACK_OUTPUT=$(npm pack --pack-destination ../../pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the platform package."
            exit 1
          fi
          FILENAME=$(basename "$PACK_OUTPUT")
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
        id: pack

      - name: Upload platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-package-${{ matrix.platform }}
          path: platforms/web/server/core/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  main-package:
    name: Pack main package
    needs: [validate, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download the generated trees and package manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-trees
          path: .

      - name: Use a bun CLI for the workspace install
        # The pinned bun lives in the flake devShell; this job keeps its Node
        # 24 from setup-node for the lint and typecheck steps below.
        run: npm install --global bun@1.3.13

      - name: Install workspace dependencies
        working-directory: .
        # bun, not npm: the web consumers declare tiqian-protocol and
        # tiqian-shared as workspace:*, and npm refuses that protocol with
        # EUNSUPPORTEDPROTOCOL. --ignore-scripts skips the root postinstall,
        # which would regenerate the protocol-ts tree and delete the manifest
        # boring pack wrote; the generated trees come from the manifests job.
        run: bun install --ignore-scripts

      - name: Assemble the @tiqian/ffi runtime
        # The skipped install hook used to compile the @tiqian/ffi runtime/
        # declarations the server/core type check resolves; engine-gen/ is
        # already in the downloaded tree, so no boring driver is needed here.
        working-directory: platforms/web/client/engine-runtime
        run: npm run build:runtime

      - name: Lint, typecheck, and build the JS entry
        working-directory: platforms/web/server/core
        run: |
          npm run lint
          npm run build
          npm run typecheck

      - name: Pack
        working-directory: platforms/web/server/core
        shell: bash
        id: pack
        run: |
          mkdir -p pack-output
          PACK_OUTPUT=$(npm pack --pack-destination pack-output | grep '\.tgz$' | head -n 1)
          if [[ -z "$PACK_OUTPUT" ]]; then
            echo "::error::Failed to pack the main package."
            exit 1
          fi
          echo "filename=$(basename "$PACK_OUTPUT")" >> "$GITHUB_OUTPUT"

      - name: Upload main package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-package
          path: platforms/web/server/core/pack-output/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified tarballs to alpha
    needs: [validate, binaries, main-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.12.1

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages

      - name: Verify a complete package set
        shell: bash
        run: |
          set -euo pipefail
          expected="binary-package-darwin-arm64 binary-package-linux-arm64-gnu binary-package-linux-x64-gnu binary-package-win32-x64-msvc main-package"
          for name in $expected; do
            if ! find "packages/$name" -name '*.tgz' | grep -q .; then
              echo "::error::Artifact $name contains no package."
              exit 1
            fi
          done
          while IFS= read -r -d '' tarball; do
            if [[ "$(basename "$tarball")" != *"-${RELEASE_VERSION}.tgz" ]]; then
              echo "::error::$(basename "$tarball") does not carry version ${RELEASE_VERSION}."
              exit 1
            fi
          done < <(find packages -name '*.tgz' -print0)

      - name: Hold every precompute package to the npm publish contract
        # Each archive is inspected before any of them reaches the registry:
        # the manifest name, the version and a workspace range are contract
        # violations, and the main package is installed so its entry loads.
        # The platform packages carry a native binary, so they get the manifest
        # and contents checks rather than an import that only works on the
        # matching platform.
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for tarball in $(find packages -maxdepth 2 -type f -name '*.tgz' | sort); do
            python3 "${GITHUB_WORKSPACE}/tools/publish-contract.py" --archive "${tarball}"
          done
          main="$(find packages/main-package -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          bash "${GITHUB_WORKSPACE}/tools/check-npm-package.sh" "${main}" --expect @tiqian/precompute --entry @tiqian/precompute

      # Platform packages first: the main package lists them as optional
      # dependencies at the same version.
      - name: Publish each tarball
        shell: bash
        run: |
          set -euo pipefail
          for name in binary-package-darwin-arm64 binary-package-linux-arm64-gnu binary-package-linux-x64-gnu binary-package-win32-x64-msvc; do
            tarball="$(find "packages/$name" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
              bash "${GITHUB_WORKSPACE}/tools/npm-publish.sh" "${tarball}" --tag alpha
          done
          tarball="$(find packages/main-package -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          bash "${GITHUB_WORKSPACE}/tools/npm-publish.sh" "${tarball}" --tag alpha

  sync-latest:
    name: Synchronize latest dist-tags
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing authenticates the dist-tag writes; no token is read.
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out the release commit
        # The dist-tag step runs tools/npm-dist-tag.sh from the repository, so
        # this job needs the checkout the publish job has.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the release npm CLI
        run: npm install --global npm@11.12.1

      - name: Point latest at the published alpha
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # 11.21.0 is the first CLI that manages dist-tags through trusted publishing.
          npm install --global npm@11.21.0
          for package in \
            @tiqian/precompute \
            @tiqian/precompute-darwin-arm64 \
            @tiqian/precompute-linux-arm64-gnu \
            @tiqian/precompute-linux-x64-gnu \
            @tiqian/precompute-win32-x64-msvc; do
            bash "${GITHUB_WORKSPACE}/tools/npm-dist-tag.sh" --package "${package}" --version "${RELEASE_VERSION}" --tag latest
          done

      - name: Verify alpha and latest
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            converged=1
            for package in \
              @tiqian/precompute \
              @tiqian/precompute-darwin-arm64 \
              @tiqian/precompute-linux-arm64-gnu \
              @tiqian/precompute-linux-x64-gnu \
              @tiqian/precompute-win32-x64-msvc; do
              tags="$(npm view "${package}" dist-tags --json)"
              if ! DIST_TAGS="${tags}" node -e '
                const tags = JSON.parse(process.env.DIST_TAGS);
                const version = process.env.RELEASE_VERSION;
                if (tags.alpha !== version || tags.latest !== version) process.exit(1);
              '; then
                converged=0
              fi
            done
            if [[ "${converged}" -eq 1 ]]; then
              echo "alpha and latest both point to ${RELEASE_VERSION} for all five packages"
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then sleep 5; fi
          done
          echo "::error::npm dist-tags did not converge on ${RELEASE_VERSION}"
          exit 1
