name: Publish Web adapters

on:
  workflow_call:
    inputs:
      web-inputs:
        description: Shared Web build artifact from this release run
        type: string
        default: ""
    outputs:
      adapters:
        description: Adapter names for alpha publication and latest tag synchronization
        value: ${{ jobs.pack.outputs.adapters }}

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  pack:
    name: Build, test and pack the Web adapters
    needs: [release-gate]
    runs-on: ubuntu-latest
    outputs:
      adapters: '["astro", "sveltekit", "react"]'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use the release npm CLI
        run: npm install --global npm@11.12.1

      - name: Prepare the Web release workspace
        uses: ./.github/actions/prepare-release-web-workspace
        with:
          artifact: ${{ inputs.web-inputs }}
          version: ${{ needs.release-gate.outputs.version }}
          linker: hoisted

      - name: Build the Web packages and precompute library
        run: |
          (cd platforms/web/client/core && npm exec -- tsc -b)
          (cd platforms/web/client/web-component && npm exec -- tsc -b --noCheck)
          (cd platforms/web/server/core && npm run build)

      - name: Supply the published Linux addon for the adapter tests
        env:
          RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          addon="@tiqian/precompute-linux-x64-gnu@${RELEASE_VERSION}"
          bash tools/npm-wait-version.sh "$addon" \
            "@tiqian/precompute@${RELEASE_VERSION}" \
            "@tiqian/protocol@${RELEASE_VERSION}" \
            "@tiqian/shared@${RELEASE_VERSION}"
          archive="$(npm pack --prefer-online --ignore-scripts --pack-destination "$RUNNER_TEMP" "$addon")"
          tar -xOf "$RUNNER_TEMP/$archive" package/index.node > platforms/web/server/core/platforms/linux-x64-gnu/index.node
          (
            cd platforms/web/server/core
            node --input-type=module -e '
              import { renderSnapshotServerAssets } from "@tiqian/precompute/precompute-html";
              renderSnapshotServerAssets({ id: "release-probe", initialStyle: "", inertTemplate: "", fontPreloads: [] });
            '
          )

      - name: Pack and verify the adapter tarballs
        env:
          RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          bash tools/pack-web-adapters.sh "$RUNNER_TEMP/web-adapters" "${RELEASE_VERSION}"

      - name: Fix the adapter tarballs for this run
        # The first attempt of the release run keeps the verified tarball as an
        # artifact and a re-run publishes that kept file instead of its rebuild,
        # so npm and the registry receive the same bytes.
        # The publish jobs download this artifact.
        uses: ./.github/actions/keep-release-files
        with:
          name: npm-tarball-web-adapters
          root: ${{ runner.temp }}/web-adapters
          path: ${{ runner.temp }}/web-adapters/*.tgz

  publish:
    name: Publish @tiqian/${{ matrix.adapter }}
    needs: [release-gate, pack]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-tiqian-${{ matrix.adapter }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJSON(needs.pack.outputs.adapters) }}
    env:
      ADAPTER: ${{ matrix.adapter }}
      RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball-web-adapters
          path: ${{ runner.temp }}/web-adapters

      - name: Publish the verified tarball to alpha
        env:
          NPM_PUBLISH_DIVERGED_LOG: ${{ runner.temp }}/npm-diverged.txt
        run: |
          npm install --global npm@11.12.1 semver@7.8.6
          export NODE_PATH="$(npm root --global)"
          node tools/check-npm-release-order.cjs "@tiqian/${ADAPTER}" "$RELEASE_VERSION"
          bash tools/npm-publish.sh "$RUNNER_TEMP/web-adapters/tiqian-${ADAPTER}-${RELEASE_VERSION}.tgz" --tag alpha

      - name: Report a version npm already holds with other bytes
        # npm-publish.sh keeps a published copy that differs from this run's
        # tarball, which happens when an earlier run of the same version
        # published it. The registry lane refuses to describe such a tarball.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-diverged-web-adapters-${{ matrix.adapter }}
          path: ${{ runner.temp }}/npm-diverged.txt
          if-no-files-found: ignore
          overwrite: true
