[package]
name = "tiqian-precompute"
description = "Font session and precompute orchestration for Tiqian in Rust"
version.workspace = true
edition.workspace = true

[dependencies]
tiqian = { path = "../tiqian", version = "0.1.0" }
# The generated engine crate. The path is the vendored mount, which is the
# same crate the tiqian facade depends on; pointing at engine-haxe/out/ would
# depend on a gitignored build output and collide with the vendored package
# name in the lockfile.
tiqian-engine = { workspace = true }
# The generated protocol crate. Like tiqian-engine it is produced by
# `node tools/generate-engine-gen.mjs` into a gitignored mount before cargo
# build; the path is that mount, not engine-haxe/out/.
tiqian-protocol = { workspace = true }
tiqian-shared = { workspace = true }
harfrust = "0.13"
skrifa = "0.46"
read-fonts = "0.43"
wuff = { version = "0.2", default-features = false, features = ["brotli"] }
sha2 = "0.10"
html5ever = "0.39.0"
url = "2"